<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VoiceNest Studio v3.5</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="app-container">
        <!-- Header -->
        <header class="header">
            <div class="logo">
                <i class="fa-solid fa-microphone-lines"></i>
                <span>VoiceNest</span>
                <span class="badge-pro">v3.5 Pro</span>
            </div>
            <div class="header-actions">
                <button class="btn-secondary"><i class="fa-solid fa-floppy-disk"></i> Save Project</button>
                <button class="btn-icon"><i class="fa-solid fa-gear"></i></button>
            </div>
        </header>

        <!-- Main Content -->
        <main class="main-content">
            <!-- Text Input -->
            <div class="text-input-section">
                <textarea placeholder="Enter your text here to generate audio..."></textarea>
            </div>

            <!-- Grid Options -->
            <div class="options-grid">
                <!-- Voice Actors -->
                <div class="option-card">
                    <h3>Voice Actors (9 Options)</h3>
                    <div class="grid-3x3">
                        <button class="grid-item active">Aung Aung <div class="controls"><i class="fa-solid fa-play"></i><i class="fa-regular fa-heart"></i></div></button>
                        <button class="grid-item">Su Su <div class="controls"><i class="fa-solid fa-play"></i><i class="fa-regular fa-heart"></i></div></button>
                        <button class="grid-item">Thura <div class="controls"><i class="fa-solid fa-play"></i><i class="fa-regular fa-heart"></i></div></button>
                        <button class="grid-item">Mya Mya <div class="controls"><i class="fa-solid fa-play"></i><i class="fa-regular fa-heart"></i></div></button>
                        <button class="grid-item">David (EN) <div class="controls"><i class="fa-solid fa-play"></i><i class="fa-regular fa-heart"></i></div></button>
                        <button class="grid-item locked">Emma (EN) <i class="fa-solid fa-lock lock-icon"></i><div class="controls"><i class="fa-solid fa-play"></i><i class="fa-regular fa-heart"></i></div></button>
                        <button class="grid-item locked">Kenshiro <i class="fa-solid fa-lock lock-icon"></i><div class="controls"><i class="fa-solid fa-play"></i><i class="fa-regular fa-heart"></i></div></button>
                        <button class="grid-item">Nisha <div class="controls"><i class="fa-solid fa-play"></i><i class="fa-regular fa-heart"></i></div></button>
                        <button class="grid-item locked">Somchai (TH) <i class="fa-solid fa-lock lock-icon"></i><div class="controls"><i class="fa-solid fa-play"></i><i class="fa-regular fa-heart"></i></div></button>
                    </div>
                </div>

                <!-- Voice Styles -->
                <div class="option-card">
                    <h3>Voice Styles (9 Options)</h3>
                    <div class="grid-3x3">
                        <button class="grid-item active">Natural Story <div class="controls"><i class="fa-solid fa-play"></i><i class="fa-regular fa-heart"></i></div></button>
                        <button class="grid-item">Emotional News <div class="controls"><i class="fa-solid fa-play"></i><i class="fa-regular fa-heart"></i></div></button>
                        <button class="grid-item">Whisper Soft <div class="controls"><i class="fa-solid fa-play"></i><i class="fa-regular fa-heart"></i></div></button>
                        <button class="grid-item locked">Dramatic Epic <i class="fa-solid fa-lock lock-icon"></i><div class="controls"><i class="fa-solid fa-play"></i><i class="fa-regular fa-heart"></i></div></button>
                        <button class="grid-item">Calm Meditation <div class="controls"><i class="fa-solid fa-play"></i><i class="fa-regular fa-heart"></i></div></button>
                        <button class="grid-item locked">Energetic Ad <i class="fa-solid fa-lock lock-icon"></i><div class="controls"><i class="fa-solid fa-play"></i><i class="fa-regular fa-heart"></i></div></button>
                        <button class="grid-item locked">Horror Tale <i class="fa-solid fa-lock lock-icon"></i><div class="controls"><i class="fa-solid fa-play"></i><i class="fa-regular fa-heart"></i></div></button>
                        <button class="grid-item">Childish Cute <div class="controls"><i class="fa-solid fa-play"></i><i class="fa-regular fa-heart"></i></div></button>
                        <button class="grid-item locked">Radio Announcer <i class="fa-solid fa-lock lock-icon"></i><div class="controls"><i class="fa-solid fa-play"></i><i class="fa-regular fa-heart"></i></div></button>
                    </div>
                </div>

                <!-- Background Music -->
                <div class="option-card">
                    <h3>Background Music (9 Options)</h3>
                    <div class="grid-3x3">
                        <button class="grid-item active">Soft Piano <div class="controls"><i class="fa-solid fa-play"></i><i class="fa-regular fa-heart"></i></div></button>
                        <button class="grid-item">Cinematic Ambient <div class="controls"><i class="fa-solid fa-play"></i><i class="fa-regular fa-heart"></i></div></button>
                        <button class="grid-item">Lo-Fi Chill <div class="controls"><i class="fa-solid fa-play"></i><i class="fa-regular fa-heart"></i></div></button>
                        <button class="grid-item">Acoustic Guitar <div class="controls"><i class="fa-solid fa-play"></i><i class="fa-regular fa-heart"></i></div></button>
                        <button class="grid-item">Epic Drums <div class="controls"><i class="fa-solid fa-play"></i><i class="fa-regular fa-heart"></i></div></button>
                        <button class="grid-item locked">Sad Violin <i class="fa-solid fa-lock lock-icon"></i><div class="controls"><i class="fa-solid fa-play"></i><i class="fa-regular fa-heart"></i></div></button>
                        <button class="grid-item">Inspirational Pop <div class="controls"><i class="fa-solid fa-play"></i><i class="fa-regular fa-heart"></i></div></button>
                        <button class="grid-item">Nature Rain <div class="controls"><i class="fa-solid fa-play"></i><i class="fa-regular fa-heart"></i></div></button>
                        <button class="grid-item locked">Cyberpunk Synth <i class="fa-solid fa-lock lock-icon"></i><div class="controls"><i class="fa-solid fa-play"></i><i class="fa-regular fa-heart"></i></div></button>
                    </div>
                </div>
            </div>
        </main>

        <!-- Player Bar -->
        <footer class="player-bar">
            <button class="btn-primary"><i class="fa-solid fa-wand-magic-sparkles"></i> Generate Audio</button>
            <button class="play-btn"><i class="fa-solid fa-play"></i></button>
            <div class="progress-bar">
                <div class="progress"></div>
            </div>
            <span class="time">00:00 / 00:00</span>
        </footer>
    </div>
    <script src="script.js"></script>
</body>
</html>
