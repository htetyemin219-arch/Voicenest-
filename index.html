<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VoiceNest - Every story deserves a voice.</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-color: #060214;
            --card-bg: rgba(13, 10, 31, 0.65);
            --card-border: rgba(147, 51, 234, 0.2);
            --card-border-focus: rgba(147, 51, 234, 0.5);
            --text-main: #ffffff;
            --text-muted: #94a3b8;
            --accent-purple: #a855f7;
            --accent-blue: #2563eb;
            --neon-glow: 0 0 20px rgba(168, 85, 247, 0.4);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 40px 20px;
            overflow-x: hidden;
            position: relative;
        }

        /* Ambient Background Graphics simulating the photo */
        body::before, body::after {
            content: '';
            position: absolute;
            width: 600px;
            height: 600px;
            border-radius: 50%;
            filter: blur(140px);
            opacity: 0.15;
            z-index: -1;
        }
        body::before {
            top: -100px;
            left: -100px;
            background: radial-gradient(circle, #a855f7, #2563eb);
        }
        body::after {
            bottom: -100px;
            right: -100px;
            background: radial-gradient(circle, #2563eb, #a855f7);
        }

        .container {
            width: 100%;
            max-width: 800px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            z-index: 1;
        }

        /* Header Section */
        header {
            text-align: center;
            margin-bottom: 10px;
        }

        .logo-container {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            margin-bottom: 8px;
        }

        .logo-icon {
            font-size: 2.5rem;
            background: linear-gradient(135deg, #a855f7, #6366f1);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0 10px rgba(168, 85, 247, 0.5));
        }

        h1 {
            font-size: 3rem;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        h1 span {
            color: var(--accent-purple);
        }

        header p {
            color: var(--text-muted);
            font-size: 1rem;
            font-weight: 400;
            letter-spacing: 0.5px;
        }

        .divider {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-top: 15px;
            color: var(--accent-purple);
            opacity: 0.6;
        }
        .divider span {
            width: 60px;
            height: 1px;
            background: linear-gradient(to right, transparent, var(--accent-purple));
        }
        .divider span:last-child {
            background: linear-gradient(to left, transparent, var(--accent-purple));
        }

        /* Cards and Layout */
        .card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            padding: 24px;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            transition: border 0.3s ease;
        }

        /* Textarea Component */
        .story-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            font-size: 0.9rem;
            color: var(--text-muted);
        }

        .story-title {
            color: var(--text-main);
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .story-title i {
            color: var(--accent-purple);
            font-size: 0.85rem;
        }

        .textarea-wrapper {
            position: relative;
        }

        textarea {
            width: 100%;
            height: 150px;
            background: rgba(10, 6, 26, 0.6);
            border: 1px solid var(--card-border);
            border-radius: 8px;
            padding: 16px;
            color: var(--text-main);
            font-size: 0.95rem;
            resize: none;
            outline: none;
            transition: all 0.3s ease;
        }

        textarea:focus {
            border-color: var(--card-border-focus);
            box-shadow: 0 0 15px rgba(147, 51, 234, 0.15);
        }

        textarea::placeholder {
            color: #475569;
        }

        /* Options Grid */
        .options-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
        }

        @media (max-width: 640px) {
            .options-grid {
                grid-template-columns: 1fr;
            }
        }

        .select-group {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 10px;
            padding: 12px 16px;
            display: flex;
            align-items: center;
            gap: 15px;
            cursor: pointer;
            position: relative;
        }

        .select-icon {
            font-size: 1.3rem;
            color: var(--accent-purple);
        }
        
        .select-icon.blue-mask {
            color: #3b82f6;
        }

        .select-info {
            display: flex;
            flex-direction: column;
            flex-grow: 1;
        }

        .select-info label {
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-bottom: 2px;
            cursor: pointer;
        }

        .select-info select {
            background: transparent;
            border: none;
            color: var(--text-main);
            font-size: 0.9rem;
            font-weight: 500;
            outline: none;
            cursor: pointer;
            appearance: none;
            -webkit-appearance: none;
            width: 100%;
            padding-right: 20px;
        }

        .select-group::after {
            content: '\f107';
            font-family: 'Font Awesome 5 Free';
            font-weight: 900;
            position: absolute;
            right: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            font-size: 0.8rem;
            pointer-events: none;
        }

        /* Action Button Component */
        .action-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            margin: 10px 0;
        }

        .btn-generate {
            width: 100%;
            max-width: 420px;
            background: linear-gradient(90deg, #d946ef, #3b82f6);
            border: none;
            border-radius: 30px;
            padding: 14px 28px;
            color: white;
            font-size: 1.05rem;
            font-weight: 600;
            letter-spacing: 0.5px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            box-shadow: 0 0 25px rgba(217, 70, 239, 0.4), 0 0 40px rgba(59, 130, 246, 0.3);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .btn-generate:hover {
            transform: translateY(-1px);
            box-shadow: 0 0 30px rgba(217, 70, 239, 0.6), 0 0 50px rgba(59, 130, 246, 0.5);
        }

        .btn-generate:active {
            transform: translateY(1px);
        }

        .sub-notice {
            font-size: 0.75rem;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            gap: 6px;
        }
        
        .sub-notice i {
            color: #3b82f6;
        }

        /* Status Bar Component */
        .status-bar {
            border: 1px solid rgba(16, 185, 129, 0.2);
            background: rgba(6, 78, 59, 0.15);
            border-radius: 8px;
            padding: 12px 20px;
            display: flex;
            align-items: center;
            gap: 20px;
            font-size: 0.9rem;
        }

        .status-tag {
            display: flex;
            align-items: center;
            gap: 8px;
            color: #10b981;
            font-weight: 600;
        }

        .status-dot {
            width: 12px;
            height: 12px;
            background-color: #10b981;
            border-radius: 50%;
            box-shadow: 0 0 10px #10b981;
        }

        .status-divider {
            width: 1px;
            height: 16px;
            background-color: rgba(255, 255, 255, 0.15);
        }

        .status-text {
            color: #cbd5e1;
        }

        /* Custom Audio Player Component */
        .audio-player-card {
            padding: 18px 24px;
        }

        .player-title {
            font-size: 0.85rem;
            color: var(--text-main);
            font-weight: 500;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .player-title i {
            color: var(--accent-purple);
        }

        .player-controls-row {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .btn-play {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: rgba(147, 51, 234, 0.2);
            border: 1px solid var(--accent-purple);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 0 12px rgba(147, 51, 234, 0.3);
            padding-left: 3px; /* centers the play triangle icon nicely */
        }

        .btn-play:hover {
            background: var(--accent-purple);
            box-shadow: 0 0 18px rgba(147, 51, 234, 0.6);
        }

        .time-display {
            font-size: 0.8rem;
            color: var(--text-muted);
            min-width: 40px;
        }

        .timeline-slider, .volume-slider {
            -webkit-appearance: none;
            appearance: none;
            background: #1e1b4b;
            height: 5px;
            border-radius: 3px;
            outline: none;
            cursor: pointer;
        }

        .timeline-slider {
            flex-grow: 1;
        }

        .volume-container {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .volume-icon {
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        .volume-slider {
            width: 70px;
        }

        /* Slider Thumb Styling */
        .timeline-slider::-webkit-slider-thumb, .volume-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: var(--text-main);
            box-shadow: 0 0 8px var(--accent-purple);
            transition: transform 0.1s;
        }

        .timeline-slider::-webkit-slider-thumb:hover, .volume-slider::-webkit-slider-thumb:hover {
            transform: scale(1.3);
        }

        .btn-download {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            color: var(--text-main);
            padding: 8px 14px;
            font-size: 0.75rem;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            transition: all 0.2s ease;
            min-width: 70px;
        }

        .btn-download:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: var(--text-muted);
        }
        
        .btn-download i {
            font-size: 1rem;
        }

        /* Footer */
        footer {
            margin-top: 30px;
            font-size: 0.75rem;
            color: var(--text-muted);
            text-align: center;
            letter-spacing: 0.5px;
        }

        footer span {
            color: var(--accent-purple);
            font-weight: 500;
        }
    </style>
</head>
<body>

    <div class="container">
        
        <!-- Header -->
        <header>
            <div class="logo-container">
                <i class="fa-solid fa-microphone-lines logo-icon"></i>
                <h1>Voice<span>Nest</span></h1>
            </div>
            <p>Every story deserves a voice.</p>
            <div class="divider">
                <span></span>
                <i class="fa-solid fa-waveform"></i>
                <span></span>
            </div>
        </header>

        <!-- Main Story Input Card -->
        <div class="card">
            <div class="story-header">
                <span class="story-title"><i class="fa-solid fa-pen"></i> Your Story <i class="fa-solid fa-paperclip" style="color: var(--text-muted); transform: rotate(45deg);"></i></span>
                <span>0 / 5000</span>
            </div>
            <div class="textarea-wrapper">
                <textarea placeholder="Type or paste your story here..."></textarea>
            </div>
        </div>

        <!-- Configuration Grid Options -->
        <div class="options-grid">
            
            <!-- Language Dropdown -->
            <div class="select-group">
                <i class="fa-solid fa-globe select-icon"></i>
                <div class="select-info">
                    <label for="lang">Language</label>
                    <select id="lang">
                        <option value="en-us">English (US)</option>
                        <option value="en-uk">English (UK)</option>
                        <option value="es">Spanish</option>
                    </select>
                </div>
            </div>

            <!-- Style Dropdown -->
            <div class="select-group">
                <i class="fa-solid fa-mask select-icon blue-mask"></i>
                <div class="select-info">
                    <label for="style">Style</label>
                    <select id="style">
                        <option value="narrative">Narrative</option>
                        <option value="conversational">Conversational</option>
                        <option value="dramatic">Dramatic</option>
                    </select>
                </div>
            </div>

            <!-- Voice Dropdown -->
            <div class="select-group">
                <i class="fa-solid fa-microphone-microphone select-icon" style="color: #ec4899;"></i>
                <div class="select-info">
                    <label for="voice">Voice</label>
                    <select id="voice">
                        <option value="luna">Luna (Female)</option>
                        <option value="leo">Leo (Male)</option>
                    </select>
                </div>
            </div>

        </div>

        <!-- Action Button Section -->
        <div class="action-container">
            <button class="btn-generate">
                Generate Voice <i class="fa-solid fa-lines-leaning" style="transform: rotate(90deg); font-size: 0.9rem;"></i>
            </button>
            <div class="sub-notice">
                <i class="fa-solid fa-shield-halved"></i> AI will transform your story into a natural voice.
            </div>
        </div>

        <!-- Status Bar -->
        <div class="status-bar">
            <div class="status-tag">
                <div class="status-dot"></div>
                Ready
            </div>
            <div class="status-divider"></div>
            <div class="status-text">Waiting for your story.</div>
        </div>

        <!-- Audio Player Card -->
        <div class="card audio-player-card">
            <div class="player-title">
                <i class="fa-solid fa-headphones"></i> Your Voice
            </div>
            <div class="player-controls-row">
                <button class="btn-play">
                    <i class="fa-solid fa-play"></i>
                </button>
                <div class="time-display">00:00</div>
                <input type="range" class="timeline-slider" min="0" max="100" value="30">
                <div class="time-display">00:00</div>
                <div class="volume-container">
                    <i class="fa-solid fa-volume-high volume-icon"></i>
                    <input type="range" class="volume-slider" min="0" max="100" value="80">
                </div>
                <button class="btn-download">
                    <i class="fa-solid fa-download"></i>
                    <span>Download</span>
                </button>
            </div>
        </div>

        <!-- Footer Footer -->
        <footer>
            &copy; 2025 <span>VoiceNest</span>. All rights reserved.
        </footer>

    </div>

</body>
</html>
