<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VoiceNest Studio v2.0 - OneStepOn Project</title>
    <style>
        :root {
            --primary-color: #2b6cb0;
            --secondary-color: #3182ce;
            --bg-color: #f7fafc;
            --card-bg: #ffffff;
            --text-color: #2d3748;
            --border-color: #e2e8f0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .studio-container {
            width: 100%;
            max-width: 800px;
            background: var(--card-bg);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }

        h1 {
            color: var(--primary-color);
            text-align: center;
            margin-bottom: 30px;
            font-size: 24px;
        }

        .control-group {
            margin-bottom: 20px;
            display: flex;
            flex-direction: column;
        }

        label {
            font-weight: 600;
            margin-bottom: 8px;
            color: #4a5568;
        }

        /* Flex Container for Voice Selector and Play Preview Button to avoid overlap */
        .voice-row {
            display: flex;
            gap: 10px;
            align-items: center;
            width: 100%;
        }

        select {
            flex: 1;
            padding: 12px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-size: 15px;
            background-color: #fff;
            min-width: 0; /* Prevents overflow in flex items */
        }

        /* Preview Button Style */
        .btn-preview {
            background-color: #edf2f7;
            color: #2b6cb0;
            border: 1px solid #cbd5e0;
            padding: 12px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 6px;
            white-space: nowrap;
            transition: all 0.2s ease;
        }

        .btn-preview:hover {
            background-color: #e2e8f0;
            border-color: #a0aec0;
        }

        .btn-preview.playing {
            background-color: #feebc8;
            color: #dd6b20;
            border-color: #fbd38d;
        }

        .volume-container {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-top: 5px;
        }

        .volume-slider {
            flex: 1;
            accent-color: var(--primary-color);
        }

        .btn-generate {
            width: 100%;
            background-color: var(--primary-color);
            color: #fff;
            border: none;
            padding: 15px;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 25px;
            transition: background 0.2s;
        }

        .btn-generate:hover {
            background-color: var(--secondary-color);
        }
    </style>
</head>
<body>

<div class="studio-container">
    <h1>🎙️ VoiceNest Studio <span style="font-size: 14px; color:#a0aec0;">v2.0</span></h1>

    <!-- 1. Language Selection -->
    <div class="control-group">
        <label>🌍 Language (ဘာသာစကား)</label>
        <select id="langSelect">
            <option value="mm">မြန်မာ (Myanmar 🇲🇲)</option>
            <option value="en">English (USA 🇺🇸)</option>
            <option value="th">ไทย (Thailand 🇹🇭)</option>
        </select>
    </div>

    <!-- 2. Voice Selection with Audio Preview (Fixed Overlap Layout) -->
    <div class="control-group">
        <label>🗣️ Voice Actor (အသံရှင်)</label>
        <div class="voice-row">
            <select id="voiceSelect">
                <!-- Javascript will dynamically inject 24 voices per language here -->
            </select>
            <button id="previewBtn" class="btn-preview" type="button">
                <span id="previewIcon">▶️</span> <span id="previewText">Listen Preview</span>
            </button>
        </div>
    </div>

    <!-- 3. Narration Style Selection -->
    <div class="control-group">
        <label>🎭 Narration Style (ခံစားချက်စတိုင်)</label>
        <select id="styleSelect">
            <!-- Will be dynamically updated based on voice characteristics -->
        </select>
    </div>

    <!-- 4. Background Ambient Music Mixer -->
    <div class="control-group">
        <label>🎵 Ambient Music Mixer (နောက်ခံတေးဂီတ)</label>
        <select id="musicSelect">
            <option value="none">မသုံးပါ (None)</option>
            <option value="cyberpunk">Cinematic Cyberpunk Beat</option>
            <option value="dark_ambient">Dark Ambient Pad</option>
            <option value="cinematic">Cinematic Beat</option>
            <option value="harp_flute">Magic Harp & Flute</option>
            <option value="piano">Inspiring Piano Uplift 🌟</option>
            <option value="violin">Sad Violin & Cello 🌟</option>
            <option value="lofi">Lofi Chill Hop 🌟</option>
            <option value="orchestral">Fierce Orchestral War 🌟</option>
            <option value="synthwave">Retro Synthwave 8-Bit 🌟</option>
        </select>
        <div class="volume-container">
            <span style="font-size: 13px; color:#718096;">Music Volume:</span>
            <input type="range" id="musicVolume" class="volume-slider" min="0" max="100" value="30">
            <span id="volLabel" style="font-size: 13px; width: 35px; text-align: right;">30%</span>
        </div>
    </div>

    <button id="generateBtn" class="btn-generate">🚀 Generate Voiceover Video</button>
</div>

<!-- Hidden HTML5 Audio Tags for Previews & Background Music Processing -->
<audio id="previewAudioPlayer" style="display: none;"></audio>

<script src="script.js"></script>
</body>
</html>
