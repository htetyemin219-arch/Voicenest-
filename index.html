<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VoiceNest</title>

<style>
body{
margin:0;
font-family:Arial,sans-serif;
background:linear-gradient(135deg,#3b82f6,#9333ea);
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;
}

.container{
background:white;
width:90%;
max-width:700px;
padding:30px;
border-radius:20px;
box-shadow:0 10px 30px rgba(0,0,0,.2);
}

h1{
text-align:center;
color:#2563eb;
}

p{
text-align:center;
color:#666;
}

textarea{
width:100%;
height:180px;
margin-top:15px;
padding:12px;
border-radius:10px;
border:1px solid #ccc;
box-sizing:border-box;
}

select{
width:100%;
padding:12px;
margin-top:15px;
border-radius:10px;
}

button{
width:100%;
margin-top:20px;
padding:15px;
background:#2563eb;
color:white;
border:none;
border-radius:10px;
font-size:18px;
}
</style>
</head>

<body>

<div class="container">

<h1>🎙️ VoiceNest</h1>

<p>AI Narrator Studio - Version 0.2</p>

<textarea placeholder="Paste your story here..."></textarea>

<select>
<option>🇲🇲 Myanmar</option>
<option>🇺🇸 English</option>
</select>

<select>
<option>📖 Storyteller</option>
<option>🎬 Cinematic</option>
<option>😌 Calm</option>
<option>🔥 Epic</option>
</select>

<button>🎙️ Generate Voice</button>

</div>

</body>
</html>
