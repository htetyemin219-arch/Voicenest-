<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VoiceNest Studio</title>
    <!-- Tailwind CSS for Dark Premium UI Theme -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#0b0c10] text-[#c5c6c7] min-h-screen font-sans">

    <div class="flex">
        <!-- Sidebar Navigation -->
        <div class="w-64 bg-[#1f2833] h-screen p-5 fixed hidden md:block border-r border-gray-800">
            <h1 id="ui-title" class="text-xl font-bold text-purple-500 mb-8">VoiceNest Studio</h1>
            <p id="ui-subtitle" class="text-xs text-gray-400 mb-4">AI Voice & Subtitle Generator</p>
            <nav class="space-y-2 text-sm text-gray-300">
                <a href="#" class="block p-2 rounded bg-purple-500/10 text-white font-medium">Home</a>
                <a href="#" class="block p-2 rounded hover:bg-gray-800">My Projects</a>
                <a href="#" id="ui-history-title" class="block p-2 rounded hover:bg-gray-800">Production Log</a>
            </nav>
        </div>

        <!-- Main Content Area -->
        <div class="flex-1 md:ml-64 p-6 max-w-4xl mx-auto space-y-6">
            
            <!-- Language Dropdown Quick Selection -->
            <div class="flex items-center justify-between bg-[#1f2833] p-4 rounded-xl border border-gray-800">
                <span class="font-semibold text-sm text-gray-300">Select Application Language:</span>
                <select id="language-select" class="bg-[#0b0c10] border border-purple-500 text-white p-2 rounded-lg text-sm focus:outline-none">
                    <option value="my">မြန်မာဘာသာ (MY) 🇲🇲</option>
                    <option value="en">English (EN) 🇺🇸</option>
                    <option value="th">ไทย (TH) 🇹🇭</option>
                </select>
            </div>

            <!-- Content Presets Section -->
            <div class="bg-[#1f2833] p-5 rounded-xl border border-gray-800 space-y-3">
                <h3 id="ui-preset-title" class="text-sm font-semibold text-purple-400">အကြောင်းအရာ အမျိုးအစားများ (Presets)</h3>
                <div class="flex flex-wrap gap-2">
                    <button id="btn-preset-ttshort" class="bg-[#0b0c10] border border-gray-700 text-xs px-3 py-2 rounded-lg hover:border-purple-500 transition">🎵 TtShort</button>
                    <button id="btn-preset-ghost" class="bg-[#0b0c10] border border-gray-700 text-xs px-3 py-2 rounded-lg hover:border-purple-500 transition">👻 Ghost Story</button>
                    <button id="btn-preset-recap" class="bg-[#0b0c10] border border-gray-700 text-xs px-3 py-2 rounded-lg hover:border-purple-500 transition">🎬 Movie Recap</button>
                    <button id="btn-preset-story" class="bg-[#0b0c10] border border-gray-700 text-xs px-3 py-2 rounded-lg hover:border-purple-500 transition">📚 Storyteller</button>
                </div>
            </div>

            <!-- Text Input Area & Word Count -->
            <div class="space-y-2">
                <textarea id="text-input" rows="6" class="w-full bg-[#1f2833] border border-gray-800 rounded-xl p-4 text-white text-sm focus:outline-none focus:border-purple-500 transition shadow-inner" placeholder="ဇာတ်ညွှန်းစာသားများ ရိုက်ထည့်ပါ..."></textarea>
                <div id="word-count-label" class="text-xs text-gray-500 text-right">စာလုံးရေစုစုပေါင်း: 0</div>
            </div>

            <!-- Core Controls: Language & Voice Configs -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4 bg-[#1f2833] p-5 rounded-xl border border-gray-800">
                <div>
                    <label id="ui-voice-title" class="block text-xs text-gray-400 mb-2">အသံရှင် ရွေးချယ်ရန်</label>
                    <select id="voice-select" class="w-full bg-[#0b0c10] border border-gray-700 text-white p-3 rounded-lg text-sm focus:outline-none focus:border-purple-500"></select>
                </div>
                <div>
                    <label id="ui-style-title" class="block text-xs text-gray-400 mb-2">အသံစတိုင်နှင့် ခံစားချက် မုဒ်များ</label>
                    <select id="style-select" class="w-full bg-[#0b0c10] border border-gray-700 text-white p-3 rounded-lg text-sm focus:outline-none focus:border-purple-500"></select>
                </div>
            </div>

            <!-- Additional Meta Panels: BGM & Ratios -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div class="bg-[#1f2833] p-4 rounded-xl border border-gray-800">
                    <label id="ui-bgm-title" class="block text-xs text-gray-400 mb-2">နောက်ခံတေးဂီတ (BGM Selector)</label>
                    <select id="bgm-select" class="w-full bg-[#0b0c10] border border-gray-700 text-white p-2.png p-3 rounded-lg text-sm focus:outline-none">
                        <option id="opt-bgm-none" value="none">မသုံးပါ (None)</option>
                        <option value="cinematic">Cinematic Beat</option>
                        <option value="dark">Dark Ambient Pad</option>
                        <option value="cyberpunk">Cinematic Cyberpunk Beat</option>
                        <option value="magic">Magic Harp & Flute</option>
                    </select>
                </div>
                <div class="bg-[#1f2833] p-4 rounded-xl border border-gray-800 space-y-1">
                    <label id="ui-ratio-title" class="block text-xs text-gray-400 mb-1">ဗီဒီယို အချိုးအစား လမ်းညွှန်ချက်</label>
                    <div id="ratio-suggestion-text" class="text-sm text-purple-400 font-medium">9:16 (Vertical) - Suggested based on settings</div>
                </div>
            </div>

            <!-- Dynamic Waveform Container -->
            <div class="flex items-center justify-center h-16 bg-[#1f2833]/50 rounded-xl border border-dashed border-gray-800" id="waveform-container">
                <!-- Waveform elements dynamically loaded by JavaScript -->
            </div>

            <!-- Action Trigger Button -->
            <button id="btn-generate" class="w-full py-4 bg-purple-600 hover:bg-purple-700 text-white font-bold rounded-xl transition shadow-lg shadow-purple-600/20 tracking-wide text-sm">
                AI Audio & Subtitle (.SRT) ထုတ်မည်
            </button>

        </div>
    </div>

    <!-- Script connection at baseline -->
    <script src="script.js"></script>
</body>
</html>
